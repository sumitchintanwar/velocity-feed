apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmds-redis
  namespace: rtmds
  labels:
    app: rtmds
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: rtmds
      component: redis
  template:
    metadata:
      labels:
        app: rtmds
        component: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
          name: redis
        resources:
          requests:
            cpu: "100m"
            memory: "256Mi"
          limits:
            cpu: "500m"
            memory: "1Gi"
        livenessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 5
          periodSeconds: 10
        readinessProbe:
          tcpSocket:
            port: 6379
          initialDelaySeconds: 2
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: rtmds-redis
  namespace: rtmds
  labels:
    app: rtmds
    component: redis
spec:
  selector:
    app: rtmds
    component: redis
  ports:
  - port: 6379
    targetPort: 6379
    name: redis

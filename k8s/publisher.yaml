apiVersion: apps/v1
kind: Deployment
metadata:
  name: rtmds-publisher
  namespace: rtmds
  labels:
    app: rtmds
    component: publisher
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: rtmds
      component: publisher
  template:
    metadata:
      labels:
        app: rtmds
        component: publisher
    spec:
      containers:
      - name: publisher
        # Replace with your actual image registry and tag
        image: rtmds-publisher:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9090
          name: http
        envFrom:
        - configMapRef:
            name: rtmds-config
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "1000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /liveness
            port: 9090
          initialDelaySeconds: 15
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /readiness
            port: 9090
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2

apiVersion: v1
kind: ConfigMap
metadata:
  name: rtmds-config
  namespace: rtmds
  labels:
    app: rtmds
data:
  RTMDS_LOG_LEVEL: "info"
  RTMDS_LOG_FORMAT: "json"
  RTMDS_SERVER_PORT: "9090"
  RTMDS_REDIS_ENABLED: "true"
  RTMDS_REDIS_ADDR: "rtmds-redis:6379"
  RTMDS_DISCOVERY_ENABLED: "true"
  RTMDS_METRICS_ENABLED: "true"
  # Optional: For benchmark mode uncomment this
  # RTMDS_FEED_BENCHMARK_MODE: "true"
